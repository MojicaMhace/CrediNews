<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Settings</title>
  <link rel="stylesheet" href="profile_settings.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="settings-page">
    <aside class="settings-sidebar">
      <h2>Settings</h2>
      <nav>
        <button class="tab-btn" data-tab="profile">Public Profile</button>
        <button class="tab-btn" data-tab="security">Account Security</button>
        <button class="tab-btn" data-tab="preferences">Preferences</button>
        <button class="tab-btn danger" data-tab="danger">Danger Zone</button>
      </nav>
    </aside>

    <main class="settings-content">
      <section class="tab" id="tab-profile">
        <h3>Public Profile</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Display Name</label>
            <input type="text" id="ps_displayName" placeholder="Your name" />
          </div>
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="ps_username" placeholder="username" />
          </div>
          <div class="form-group full">
            <label>Bio</label>
            <textarea id="ps_bio" rows="4" placeholder="Tell people about you"></textarea>
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="ps_location" placeholder="City, Country" />
          </div>
        </div>
        <div class="actions">
          <button id="saveProfileBtn" class="btn primary"><i class="fas fa-save"></i> Save Profile</button>
          <a class="btn ghost" href="notifications.html"><i class="fas fa-bell"></i> Activity</a>
        </div>
      </section>

      <section class="tab" id="tab-security">
        <h3>Account Security</h3>
        <div class="form-grid">
          <div class="form-group full">
            <label>Change Email</label>
            <input type="email" id="ps_email" placeholder="New email" />
          </div>
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="ps_current_password" placeholder="Current password" />
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="ps_new_password" placeholder="New password" />
          </div>
        </div>
        <div class="actions">
          <button id="changeEmailBtn" class="btn primary"><i class="fas fa-envelope"></i> Update Email</button>
          <button id="changePasswordBtn" class="btn primary"><i class="fas fa-key"></i> Update Password</button>
        </div>
      </section>

      <section class="tab" id="tab-preferences">
        <h3>Preferences</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Theme</label>
            <select id="ps_theme">
              <option value="default">Default</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <div class="form-group">
            <label>Language</label>
            <select id="ps_language">
              <option value="en">English</option>
              <option value="tl">Filipino</option>
              <option value="es">Spanish</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="savePreferencesBtn" class="btn primary"><i class="fas fa-toggle-on"></i> Save Preferences</button>
        </div>
      </section>

      <section class="tab" id="tab-danger">
        <h3>Danger Zone</h3>
        <div class="danger-card">
          <p>Deactivate or permanently delete your account.</p>
          <div class="actions">
            <button id="deactivateBtn" class="btn danger-outline"><i class="fas fa-user-slash"></i> Deactivate Account</button>
            <button id="deleteAccountBtn" class="btn danger"><i class="fas fa-trash"></i> Delete Account</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="ps_toast" class="toast" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="profile_settings.js"></script>
</body>
</html>
