<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CrediNews</title>
    <link rel="stylesheet" href="styles.css?v=layout-small-1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-body register-page">
    <div class="auth-container auth-split">
        <aside class="auth-hero has-image" style="background-image: url('images/credi_reg.png');">
        </aside>
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-shield-alt"></i>
                    <span>CrediNews</span>
                </div>
                <h2>Create Account</h2>
                <p>Join us to start analyzing news credibility</p>
            </div>

            
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required pattern="^[A-Za-z][A-Za-z\s'-]*$" title="Use letters, spaces, apostrophes or hyphens; no numbers.">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-toggle">
                        <input type="password" id="password" name="password" required aria-describedby="passwordHelp">
                        <button type="button" class="toggle-visibility" aria-label="Show password" data-target="password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <ul class="password-hints" id="passwordHelp">
                        <li id="req-length" class="invalid">• At least 8 characters</li>
                        <li id="req-upper" class="invalid">• Uppercase letter (A–Z)</li>
                        <li id="req-lower" class="invalid">• Lowercase letter (a–z)</li>
                        <li id="req-number" class="invalid">• Number (0–9)</li>
                        <li id="req-special" class="invalid">• Special character (!@#$…)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-with-toggle">
                        <input type="password" id="confirmPassword" name="confirmPassword" required aria-describedby="confirmHint">
                        <button type="button" class="toggle-visibility" aria-label="Show password" data-target="confirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div id="confirmHint" class="match-hint" style="display:none">• Passwords must match</div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" required>
                        <span class="checkmark"></span>
                        <p>I agree to the <a href="#" id="termsLink">Terms of Service</a> and <a href="#" id="privacyLink">Privacy Policy</a></p>
                    </label>
                </div>

                <button type="submit" class="auth-btn primary">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="auth-btn google" id="googleSignUp">
                    <i class="fab fa-google"></i>
                    Sign up with Google
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>

        <div class="theme-toggle-auth">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <!-- Firebase SDK v8 (more stable) -->
    <script src="https://www.gstatic.com/firebase/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebase/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebase/8.10.1/firebase-firestore.js"></script>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script>
    // --- Setup and Helper Functions (MUST REMAIN HERE) ---
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Disallow digits in Full Name as user types
    const fullNameInput = document.getElementById("fullName");
    if (fullNameInput) {
        fullNameInput.addEventListener("input", function() {
            this.value = this.value.replace(/[0-9]/g, "");
        });
    }

    function isValidFullName(name) {
        // Letters, spaces, apostrophes, and hyphens; must start with a letter
        return /^[A-Za-z][A-Za-z\s'-]*$/.test(name);
    }

    function isStrongPassword(pwd) {
        const rules = {
            length: (pwd || '').length >= 8,
            upper: /[A-Z]/.test(pwd || ''),
            lower: /[a-z]/.test(pwd || ''),
            number: /\d/.test(pwd || ''),
            special: /[!@#$%^&*()_+\-=[\]{};':"\\|,.<>\/?]/.test(pwd || '')
        };
        return Object.values(rules).every(Boolean);
    }

    function updatePasswordHints(pwd) {
        const states = {
            length: (pwd || '').length >= 8,
            upper: /[A-Z]/.test(pwd || ''),
            lower: /[a-z]/.test(pwd || ''),
            number: /\d/.test(pwd || ''),
            special: /[!@#$%^&*()_+\-=[\]{};':"\\|,.<>\/?]/.test(pwd || '')
        };
        const setState = (id, ok) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('valid', ok);
            el.classList.toggle('invalid', !ok);
        };
        setState('req-length', states.length);
        setState('req-upper', states.upper);
        setState('req-lower', states.lower);
        setState('req-number', states.number);
        setState('req-special', states.special);

        const pwdInput = document.getElementById('password');
        if (pwdInput) {
            const allOk = Object.values(states).every(Boolean);
            pwdInput.setCustomValidity(allOk ? '' : 'Password must be at least 8 characters and include uppercase, lowercase, number, and special character.');
        }
    }

    function updateConfirmHint(pwd, confirm) {
        const hint = document.getElementById('confirmHint');
        if (!hint) return;
        const confirmInput = document.getElementById('confirmPassword');
        const hasContent = (confirm || '').length > 0;

        if (!hasContent) {
            hint.style.display = 'none';
            if (confirmInput) confirmInput.setCustomValidity('');
            return;
        }

        hint.style.display = 'block';
        const match = (pwd || '') === (confirm || '');
        hint.classList.toggle('valid', match);
        hint.classList.toggle('invalid', !match);
        hint.textContent = match ? '✔ Passwords match' : '• Passwords must match';
        if (confirmInput) confirmInput.setCustomValidity(match ? '' : 'Passwords do not match.');
    }

    const pwdInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    if (pwdInput) {
        pwdInput.addEventListener('input', () => {
            updatePasswordHints(pwdInput.value);
            if (confirmInput) updateConfirmHint(pwdInput.value, confirmInput.value);
        });
        updatePasswordHints(pwdInput.value);
    }
    if (confirmInput) {
        confirmInput.addEventListener('input', () => updateConfirmHint(pwdInput.value, confirmInput.value));
    }

    // Password visibility toggles (No Change)
    document.querySelectorAll('.toggle-visibility').forEach((btn) => {
        const targetId = btn.dataset.target;
        const input = document.getElementById(targetId);
        if (!input) return;
        btn.addEventListener('click', () => {
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            const icon = btn.querySelector('i');
            if (icon) {
                icon.classList.toggle('fa-eye', isHidden);
                icon.classList.toggle('fa-eye-slash', !isHidden);
            }
        });
    });

    // Simple notification helpers (Inline message - must be kept for local errors)
    function showInlineMessage(text, type = 'info') {
        document.querySelectorAll('.notification.inline').forEach(n => n.remove());
        const box = document.createElement('div');
        box.className = `notification inline ${type}`;
        box.style.marginBottom = '12px';
        box.style.padding = '12px';
        box.style.borderRadius = '8px';
        box.style.display = 'flex';
        box.style.alignItems = 'center';
        box.style.gap = '8px';
        box.innerHTML = `<span>${type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️'}</span><span>${text}</span>`;
        const form = document.getElementById('registerForm');
        form.parentNode.insertBefore(box, form);
    }

    // Cooldown setup (Must be kept here)
    const COOLDOWN_MS = 60 * 1000;
    const BLOCK_COOLDOWN_MS = 5 * 60 * 1000;
    const cooldownKey = 'register_cooldown_until';
    const BLOCK_KEY = 'register_block_until';
    let submitting = false;
    let countdownTimer = null;
    function startCountdown(untilTs) {
        const submitBtn = document.querySelector('#registerForm button[type="submit"]');
        const update = () => {
            const remaining = Math.max(0, untilTs - Date.now());
            const secs = Math.ceil(remaining / 1000);
            if (remaining <= 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
                return;
            }
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class=\"fas fa-ban\"></i> Wait ${secs}s`;
            }
        };
        update();
        countdownTimer = setInterval(update, 1000);
    }
    const existingUntil = parseInt(localStorage.getItem(cooldownKey) || '0', 10);
    const existingBlock = parseInt(localStorage.getItem(BLOCK_KEY) || '0', 10);
    if (existingBlock > Date.now()) {
        showInlineMessage('We have blocked requests from this device due to unusual activity. Please wait and try again later.', 'error');
        startCountdown(existingBlock);
    } else if (existingUntil > Date.now()) {
        startCountdown(existingUntil);
    }

    // Modal functions (must be kept here)
    const modal = (function(){
        // ... (modal creation and link event listeners remain the same)
        const el = document.createElement('div');
        el.id = 'legalModal';
        el.style.position = 'fixed';
        el.style.inset = '0';
        el.style.background = 'rgba(0,0,0,0.6)';
        el.style.display = 'none';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
        el.innerHTML = `
            <div style="max-width: 700px; width: 92%; background:#0e1726; color:#e2e8f0; border:1px solid rgba(255,255,255,0.15); border-radius:12px; box-shadow:0 12px 24px rgba(0,0,0,.4);">
            <div style="padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:space-between;">
                <div id="legalTitle" style="font-weight:700;">Terms</div>
                <button id="legalClose" style="background:transparent; color:#94a3b8; border:none; font-size:18px; cursor:pointer">✕</button>
            </div>
            <div id="legalBody" style="padding:16px; max-height: 60vh; overflow:auto; line-height:1.6; font-size:.95rem; text-align:left"></div>
            <div style="padding:12px 16px; display:flex; justify-content:flex-end;">
                <button id="legalOk" style="background:#22c55e; color:#0b1220; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer;">OK</button>
            </div>
            </div>`;
        document.body.appendChild(el);
        const show = (title, html) => { document.getElementById('legalTitle').textContent = title; document.getElementById('legalBody').innerHTML = html; el.style.display='flex'; };
        const hide = () => { el.style.display='none'; };
        el.querySelector('#legalClose').addEventListener('click', hide);
        el.querySelector('#legalOk').addEventListener('click', hide);
        return { show, hide };
    })();

    const termsHtml = `
      <p>By creating an account, you agree to use CrediNews responsibly and comply with applicable laws. Do not misuse features or attempt to interfere with service integrity. Content you submit must be lawful and not infringe rights of others. We may update these terms; continued use constitutes acceptance.</p>
      <p>Accounts may be limited or suspended for abusive activity. Some features rely on third-party services subject to their terms.</p>`;
    const privacyHtml = `
      <p>We store basic profile data and activity needed to provide features like verification history. We do not sell personal data. You can request deletion by contacting support. Analytics and authentication data may be processed by Firebase and similar providers.</p>
      <p>Local storage may be used to remember sessions. Using the site implies consent.</p>`;

    const termsLink = document.getElementById('termsLink');
    const privacyLink = document.getElementById('privacyLink');
    if (termsLink) termsLink.addEventListener('click', (e)=>{ e.preventDefault(); modal.show('Terms of Service', termsHtml); });
    if (privacyLink) privacyLink.addEventListener('click', (e)=>{ e.preventDefault(); modal.show('Privacy Policy', privacyHtml); });


    // --- DISPATCHER: Logic to choose which handler to use on page load ---
    (function initializeRegistrationFlow() {
        const urlParams = new URLSearchParams(window.location.search);
        const isGoogleSignup = urlParams.get('google_signup') === '1';
        const pendingData = JSON.parse(sessionStorage.getItem('googleAuthPending') || 'null');
        
        const registerForm = document.getElementById('registerForm');
        const submitBtn = registerForm ? registerForm.querySelector('button[type="submit"]') : null;

        if (!registerForm || !window.authManager) return; // Exit if form or AuthManager is not found

        if (isGoogleSignup && pendingData) {
            console.log('✅ Google signup flow detected. Adjusting form.');

            // 1. UI Adjustments
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const passwordGroup = document.querySelector('.form-group:has(#password)');
            const confirmPasswordGroup = document.querySelector('.form-group:has(#confirmPassword)');
            const passwordHints = document.getElementById('passwordHelp');
            const divider = document.querySelector('.divider');
            const googleBtn = document.getElementById('googleSignUp');
            
            if (fullNameInput) {
                fullNameInput.value = pendingData.name || '';
            }
            if (emailInput) {
                emailInput.value = pendingData.email;
                emailInput.disabled = true; // Email is fixed
            }

            // 2. Hide password elements
            if (passwordGroup) passwordGroup.style.display = 'none';
            if (confirmPasswordGroup) confirmPasswordGroup.style.display = 'none';
            if (passwordHints) passwordHints.style.display = 'none';
            if (divider) divider.style.display = 'none';
            if (googleBtn) googleBtn.style.display = 'none';
            
            if (submitBtn) {
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Complete Registration';
            }
            
            // 3. Attach Google Submit Handler (Calls the method in auth.js)
            registerForm.addEventListener("submit", function (e) {
                // Ensure form and cooldown checks are done locally before calling authManager
                const blockUntil = parseInt(localStorage.getItem(BLOCK_KEY) || '0', 10);
                if (blockUntil > Date.now() || submitting) {
                    e.preventDefault();
                    return;
                }
                
                // Call the consolidated method in auth.js
                window.authManager.handleGoogleSignupSubmit(e, pendingData);
            });
            
        } else {
            // Standard Email/Password flow: Attach the standard handler (Calls the method in auth.js)
            registerForm.addEventListener("submit", (e) => {
                e.preventDefault();
                
                // Perform local checks (cooldown, validation)
                const blockUntil = parseInt(localStorage.getItem(BLOCK_KEY) || '0', 10);
                if (blockUntil > Date.now() || submitting) return;

                const fullName = document.getElementById("fullName").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                if (!isValidFullName(fullName)) {
                    showInlineMessage("Please enter a valid full name using letters only (spaces, hyphens, apostrophes allowed).", 'error');
                    return;
                }
                if (!isStrongPassword(password)) {
                    showInlineMessage("Password must be at least 8 characters and include uppercase, lowercase, a number, and a special character.", 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    showInlineMessage("Passwords do not match!", 'error');
                    return;
                }
                
                // Call the consolidated method in auth.js
                submitting = true;
                window.authManager.setButtonLoading(submitBtn, true);
                
                window.authManager.handleEmailPasswordRegister({ fullName, email, password })
                    .then(result => {
                        submitting = false;
                        window.authManager.setButtonLoading(submitBtn, false);
                        
                        if (result.success) {
                            showInlineMessage(`Verification email sent to ${email}. Check your Spam/Junk folder. Please verify your email before logging in.`, 'success');
                            const until = Date.now() + COOLDOWN_MS;
                            localStorage.setItem(cooldownKey, String(until));
                            startCountdown(until);
                            
                        } else {
                            let msg = 'Registration failed. Please try again.';
                            switch (result.code) {
                                case 'auth/email-already-in-use':
                                    msg = 'This email is already registered. Try signing in or resetting your password.';
                                    break;
                                case 'auth/too-many-requests':
                                    msg = 'We have blocked requests from this device due to unusual activity. Please wait and try again later.';
                                    const blockUntil = Date.now() + BLOCK_COOLDOWN_MS;
                                    localStorage.setItem(BLOCK_KEY, String(blockUntil));
                                    startCountdown(blockUntil);
                                    break;
                                default:
                                    // Use the message from Firebase error if available
                                    msg = result.message || msg; 
                            }
                            showInlineMessage(`${msg} (${result.code || 'unknown'})`, 'error');
                        }
                    });
            });
        }
    })();
    </script>
</body>
</html>
