<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trends - CrediNews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="trends.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo.png">
  <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">

</head>
<body class="trends-page">
    <!-- Navigation (About-style) -->
    <div class="site-simple-nav">
      <nav>
          <div class="logo">
              <img src="images/shield.png" alt="CrediNews" class="brand-logo" />
              <span class="brand-text">CREDINEWS</span>
          </div>
          <div class="nav-links">
              <a href="index.html">Home</a>
              <a href="verify-news.html">Verify News</a>
              <a href="trends.html" class="active">Trends</a>
              <a href="report.html">Report</a>
              <a href="about.html">About</a>
          </div>
          <div class="nav-controls">
            <div id="authButtons" class="auth-buttons">
              <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
              <a href="register.html" class="signup-btn"><i class="fas fa-user-plus"></i> Sign Up</a>
            </div>
            <div class="user-account-btn" id="userAccountBtn" style="display:none;">
              <i class="fas fa-user"></i>
              <span class="user-name">Credi News</span>
              <i class="fas fa-chevron-down"></i>
              <div class="user-dropdown" id="userDropdown"></div>
            </div>
          </div>
      </nav>
    </div>

    <main class="main-content">
        <section class="latest-news-section">
            <div class="container">
                <h1 class="section-title">Latest Verified Facebook News</h1>
                <div class="trends-controls">
                    <input id="trends-search" type="text" class="search-input" placeholder="Search analyzed text or label">
                    <select id="trends-sort" class="sort-select">
                        <option value="date_desc">Newest</option>
                        <option value="date_asc">Oldest</option>
                        <option value="label_desc">Label: High to Low</option>
                        <option value="label_asc">Label: Low to High</option>
                    </select>
                </div>
                <div class="pagination-controls" id="trends-pagination-top">
                    <button class="page-btn" id="prev-page-top" disabled>Prev</button>
                    <span class="page-info" id="page-info-top">Page 1</span>
                    <button class="page-btn" id="next-page-top">Next</button>
                </div>
            </div>
        </section>
        <div id="trends-feed-container" class="trends-grid"></div>
        <div class="pagination-controls" id="trends-pagination">
            <button class="page-btn" id="prev-page" disabled>Prev</button>
            <span class="page-info" id="page-info">Page 1</span>
            <button class="page-btn" id="next-page">Next</button>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="trends.js"></script>
</body>
</html>
