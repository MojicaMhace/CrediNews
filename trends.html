<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trends - CrediNews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="trends.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo2.png">
  <link rel="icon" type="image/png" href="images/logo2.png">
    <link rel="apple-touch-icon" href="images/logo2.png">

</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html" class="logo">
                    <img src="images/logo.png" class="brand-logo" alt="CrediNews logo">
                    <span class="brand-text">CREDINEWS</span>
                </a>
            </div>
            <div class="nav-menu">
                <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="verify-news.html" class="nav-link">Verify News</a></li>
                <li><a href="trends.html" class="nav-link active">Trends</a></li>
                <li><a href="report.html" class="nav-link">Report</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="latest-news-section">
            <div class="container">
                <h1 class="section-title">Latest Verified Facebook News</h1>
                <div class="trends-controls">
                    <input id="trends-search" type="text" class="search-input" placeholder="Search analyzed text or label">
                    <select id="trends-sort" class="sort-select">
                        <option value="date_desc">Newest</option>
                        <option value="date_asc">Oldest</option>
                        <option value="label_desc">Label: High to Low</option>
                        <option value="label_asc">Label: Low to High</option>
                    </select>
                </div>
            </div>
        </section>
        <div id="trends-feed-container" class="trends-grid"></div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    <script src="trends.js"></script>
</body>
</html>
