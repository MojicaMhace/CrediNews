<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poser Detection - CrediNews</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="verify-news-page">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html" class="logo">
                    <svg width="24" height="28" viewBox="0 0 24 28" class="brand-logo">
                        <path d="M12 2 L20 5 L20 14 Q20 18 17 21 Q14 24 12 26 Q10 24 7 21 Q4 18 4 14 L4 5 Z" 
                              fill="white" stroke="white" stroke-width="1"/>
                        <path d="M8 12 L11 15 L16 10" stroke="#2D3748" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="brand-text">CREDINEWS</span>
                </a>
            </div>
            <div class="nav-menu">
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="verify-news.html" class="nav-link">Verify News</a></li>
                    <li><a href="trends.html" class="nav-link">Trends</a></li>
                    <li><a href="report.html" class="nav-link">Report</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-title-section">
                <h1 class="page-title">Poser Detection</h1>
                <div class="title-underline"></div>
            </div>

            <!-- Toggle Bar -->
            <div class="toggle-buttons">
                <button id="show-facebook-verify" class="toggle-btn">Verify Facebook News</button>
                <button id="show-url-verify" class="toggle-btn">Verify News Article</button>
                <button id="open-poser-detection" class="toggle-btn active">Poser Detection</button>
            </div>

            <div class="verify-news-container">
                <div class="verify-card poser-accent">
                    <div class="card-header">
                        <i class="fas fa-user-secret card-icon poser-accent"></i>
                        <h2 class="card-title">Assess Poster Credibility</h2>
                    </div>
                    <p class="card-description">Enter a Facebook Page/Post URL to check if the poster appears credible or a potential poser.</p>

                    <div class="form-group">
                        <label for="poser-url" class="form-label">Facebook Page/Post URL</label>
                        <input type="url" id="poser-url" class="form-input" placeholder="https://www.facebook.com/..." />
                        <div class="input-help">
                            <i class="fas fa-info-circle"></i>
                            We analyze profile signals, posting patterns, and content markers.
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="poser-notes" class="form-label">Notes (optional)</label>
                        <textarea id="poser-notes" class="form-textarea" rows="4" placeholder="Any context or observations..."></textarea>
                    </div>

                    <button type="button" class="verify-btn" id="run-poser-btn" style="background:#7e22ce;">
                        <i class="fas fa-shield-alt"></i>
                        Run Poser Detection
                    </button>
                </div>

                <div id="poser-result" class="results-section" style="display:none; margin-top:1rem;">
                    <div class="results-card">
                        <div class="results-header">
                            <h3 class="results-title">Poser Detection Result</h3>
                        </div>
                        <div class="results-content">
                            <div id="poser-analysis-details"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="poser-detection.js"></script>
    <style>
      .toggle-buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center; }
      .toggle-btn { padding: 0.5rem 1rem; border: 1px solid #e5e7eb; background: #f9fafb; color: #374151; border-radius: 6px; cursor: pointer; font-weight: 600; }
      .toggle-btn.active { background: #3b82f6; color: #fff; border-color: #2563eb; }
      #show-url-verify.toggle-btn.active { background: #22c55e; color: #fff; border-color: #16a34a; }
      #show-facebook-verify.toggle-btn.active { background: #1877f2; color: #fff; border-color: #166fe5; }
      #open-poser-detection.toggle-btn:hover { background: #7e22ce; color: #fff; border-color: #7e22ce; }
      .verify-card.poser-accent { border-left: 4px solid #7e22ce; }
      .card-icon.poser-accent { color: #7e22ce; }
      .toggle-btn { transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
    </style>
    <script>
      // Navigation wiring
      document.addEventListener('DOMContentLoaded', function() {
        var fbBtn = document.getElementById('show-facebook-verify');
        var urlBtn = document.getElementById('show-url-verify');
        if (fbBtn) fbBtn.addEventListener('click', function() { window.location.href = 'verify-news.html'; });
        if (urlBtn) urlBtn.addEventListener('click', function() { window.location.href = 'verify-news.html'; });
      });
    </script>
</body>
</html>
