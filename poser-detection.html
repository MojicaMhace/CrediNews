<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poser Detection - CrediNews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="poser-detection.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo.png">
  <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">
</head>
<body class="poser-detection-page">
    <div class="site-simple-nav">
      <nav>
          <div class="logo">
              <img src="images/shield.png" alt="CrediNews" class="brand-logo" />
              <span class="brand-text">CREDINEWS</span>
          </div>
          <div class="nav-links">
              <a href="index.html">Home</a>
              <a href="verify-news.html">Verify News</a>
              <a href="trends.html">Trends</a>
              <a href="report.html">Report</a>
              <a href="about.html">About</a>
          </div>
          <div class="nav-controls">
            <div id="authButtons" class="auth-buttons">
              <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
              <a href="register.html" class="signup-btn"><i class="fas fa-user-plus"></i> Sign Up</a>
            </div>
            <div class="user-account-btn" id="userAccountBtn" style="display:none;">
              <i class="fas fa-user"></i>
              <span class="user-name">Credi News</span>
              <i class="fas fa-chevron-down"></i>
              <div class="user-dropdown" id="userDropdown"></div>
            </div>
          </div>
      </nav>
    </div>

    <main class="main-content">
        <div class="container">
            <div class="page-title-section">
                <h1 class="page-title">Poser Detection</h1>
                <div class="title-underline"></div>
            </div>

            <div class="verify-news-container">
                <div class="toggle-buttons">
                    <button id="show-facebook-verify" class="toggle-btn">Verify Facebook News</button>
                    <button id="open-poser-detection" class="toggle-btn active">Poser Detection</button>
                </div>

                <div class="verify-card poser-card">
                <div class="card-header">
                    <i class="fas fa-user-secret card-icon"></i>
                    <h2 class="card-title">Assess Poser Credibility</h2>
                </div>

                <p class="card-description">
                    Enter a Facebook Page URL to check if the poster appears credible or a potential poser.
                </p>

                <div class="form-group">
                    <label for="poser-url" class="form-label">Facebook Page URL</label>
                    <input 
                        type="url" 
                        id="poser-url" 
                        class="form-input" 
                        placeholder="Paste Facebook Page or User URL/Links" 
                        autocomplete="off"
                    />
                    <div id="poser-url-error" class="input-error"></div>
                </div>

                <div class="input-help">
                    <i class="fas fa-info-circle"></i>
                    <span>We analyze profile signals, posting patterns, and content markers.</span>
                </div>

                <button type="button" id="run-poser-btn" class="verify-btn poser-run-btn">
                    <i class="fas fa-shield-alt"></i>
                    RUN POSER DETECTION
                </button>
                </div>
            </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    
    <script src="poser-detection.js?v=3"></script>
</body>
</html>
