<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poser Detection - CrediNews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="poser-detection.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo2.png">
  <link rel="icon" type="image/png" href="images/logo2.png">
    <link rel="apple-touch-icon" href="images/logo2.png">
</head>
<body class="poser-detection-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html" class="logo">
                    <img src="images/logo.png" class="brand-logo" alt="CrediNews logo">
                    <span class="brand-text">CREDINEWS</span>
                </a>
            </div>
            <div class="nav-menu">
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="verify-news.html" class="nav-link">Verify News</a></li>
                    <li><a href="trends.html" class="nav-link">Trends</a></li>
                    <li><a href="report.html" class="nav-link">Report</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-title-section">
                <h1 class="page-title">Poser Detection</h1>
                <div class="title-underline"></div>
            </div>

            <div class="verify-news-container">
                <div class="toggle-buttons">
                    <button id="show-facebook-verify" class="toggle-btn">Verify Facebook News</button>
                    <button id="show-url-verify" class="toggle-btn">Verify News Article</button>
                    <button id="open-poser-detection" class="toggle-btn active">Poser Detection</button>
                </div>

                <div class="verify-card poser-card">
                <div class="card-header">
                    <i class="fas fa-user-secret card-icon"></i>
                    <h2 class="card-title">Assess Poster Credibility</h2>
                </div>

                <p class="card-description">
                    Enter a Facebook Page/Post URL to check if the poster appears credible or a potential poser.
                </p>

                <div class="form-group">
                    <label for="poser-url" class="form-label">Facebook Page/Post URL</label>
                    <input 
                        type="url" 
                        id="poser-url" 
                        class="form-input" 
                        placeholder="Paste Facebook Page or User URL/Links" 
                        autocomplete="off"
                    />
                    <div id="poser-url-error" class="input-error"></div>
                </div>

                <div class="input-help">
                    <i class="fas fa-info-circle"></i>
                    <span>We analyze profile signals, posting patterns, and content markers.</span>
                </div>

                <button type="button" id="run-poser-btn" class="verify-btn poser-run-btn">
                    <i class="fas fa-shield-alt"></i>
                    RUN POSER DETECTION
                </button>
                </div>
            </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    
    <script src="poser-detection.js?v=3"></script>
</body>
</html>
