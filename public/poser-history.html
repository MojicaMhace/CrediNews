<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poser Detection History - CrediNews</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/my-verifications.css">
  <link rel="stylesheet" href="assets/css/poser-history.css?v=25">
  <link rel="stylesheet" href="assets/css/poser-detection.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo.png">
</head>
<body>
  <div class="site-simple-nav">
    <nav>
      <div class="logo">
        <img src="assets/images/shield.png" alt="CrediNews" class="brand-logo" />
        <span class="brand-text">CREDINEWS</span>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="verify-news.html">Verify News</a>
        <a href="trends.html">Trends</a>
        <a href="report.html">Report</a>
        <a href="about.html">About</a>
      </div>
      <div class="nav-controls">
        <div id="authButtons" class="auth-buttons">
          <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
          <a href="register.html" class="signup-btn"><i class="fas fa-user-plus"></i> Sign Up</a>
        </div>
        <div class="user-account-btn" id="userAccountBtn" style="display:none;">
          <i class="fas fa-user"></i>
          <span class="user-name">Credi News</span>
          <i class="fas fa-chevron-down"></i>
          <div class="user-dropdown" id="userDropdown"></div>
        </div>
        <button id="theme-toggle-btn" class="nav-theme-toggle" aria-label="Toggle Dark Mode">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </nav>
  </div>
  <main class="main-content pos-history-page">
    <section class="section active">
      <div class="container">
        <h2 class="section-title">Poser Detection History</h2>
        <div class="title-accent"></div>
        <div class="toolbar">
          <input id="ph-search" type="text" placeholder="Search by page name or input…">
          <select id="ph-sort">
            <option value="date_desc">Newest</option>
            <option value="date_asc">Oldest</option>
            <option value="verdict_poser">Likely Poser</option>
            <option value="verdict_mixed">Mixed Signals</option>
            <option value="verdict_authentic">Likely Authentic</option>
          </select>
        </div>
        <div id="historyGrid" class="poser-grid"></div>
        <div id="ph-pagination" class="pagination">
          <button id="ph-prev" class="pager-btn">&lt; Prev</button>
          <div class="pager-info"><span id="ph-page">1</span> / <span id="ph-pages">1</span></div>
          <button id="ph-next" class="pager-btn">Next &gt;</button>
        </div>
      </div>
    </section>
    
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/poser-history.js?v=25"></script>
</body>
</html>
