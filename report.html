<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports - CrediNews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="report.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo2.png">
    <link rel="icon" type="image/png" href="images/logo2.png">
    <link rel="apple-touch-icon" href="images/logo2.png">


</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html" class="logo">
                    <img src="images/logo.png" class="brand-logo" alt="CrediNews logo">
                    <span class="brand-text">CREDINEWS</span>
                </a>
            </div>
            <div class="nav-menu">
                <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="verify-news.html" class="nav-link">Verify News</a></li>
                <li><a href="trends.html" class="nav-link">Trends</a></li>
                <li><a href="report.html" class="nav-link active">Report</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>

                </ul>
            </div>
        </div>
    </nav>

                <!-- Statistics Section -->
        <section class="statistics-section">
            <div class="container">
                <div class="stats-grid">
                    <div class="stat-box stat-card stat-card--credible">
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-content">
                             <div id="total-analyzed" class="stat-number">--</div>
                             <div class="stat-label">Facebook News Analyzed</div>
                         </div>
                     </div>
                     <div class="stat-box stat-card stat-card--credible">
                         <div class="stat-icon">
                             <i class="fas fa-check-circle"></i>
                         </div>
                         <div class="stat-content">
                             <div id="credible-count" class="stat-number">--</div>
                             <div class="stat-label">Credible (Verified)</div>
                        </div>
                    </div>
                    <div class="stat-box stat-card stat-card--low">
                        <div class="stat-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="stat-content">
                            <div id="low-count" class="stat-number">--</div>
                            <div class="stat-label">Low Credibility (Fake)</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="container">
                <div class="charts-grid">
                    <!-- Labels Breakdown Doughnut -->
                    <div class="chart-container">
                        <div class="chart-header">
                            <div>
                                <div class="chart-title">Credibility Labels Breakdown</div>
                                <div class="chart-subtitle">CREDIBLE, LOW, MIXED, UNVERIFIED</div>
                            </div>
                        </div>
                        <canvas id="breakdownChart"></canvas>
                    </div>

                    <!-- Volume Line Chart with Filters -->
                    <div class="chart-container">
                        <div class="chart-header">
                            <div>
                                <div class="chart-title">Volume of News Analyzed</div>
                                <div class="chart-subtitle">Switch between Day / Week / Month / Year</div>
                            </div>
                            <div class="filter-buttons" id="timeFilters">
                                <button id="filter-day" type="button">Day</button>
                                <button id="filter-week" type="button">Week</button>
                                <button id="filter-month" type="button" class="active">Month</button>
                                <button id="filter-year" type="button">Year</button>
                            </div>
                        </div>
                        <canvas id="volumeChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    <script src="reports.js"></script>
    
        
</body>
 </html>
