<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports - CrediNews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="report.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo.png">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">


</head>
<body>
    <!-- Navigation (About-style) -->
    <div class="site-simple-nav">
      <nav>
          <div class="logo">
              <img src="images/shield.png" alt="CrediNews" class="brand-logo" />
              <span class="brand-text">CREDINEWS</span>
          </div>
          <div class="nav-links">
              <a href="index.html">Home</a>
              <a href="verify-news.html">Verify News</a>
              <a href="trends.html">Trends</a>
              <a href="report.html" class="active">Report</a>
              <a href="about.html">About</a>
          </div>
          <div class="nav-controls">
            <div id="authButtons" class="auth-buttons">
              <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</a>
              <a href="register.html" class="signup-btn"><i class="fas fa-user-plus"></i> Sign Up</a>
            </div>
            <div class="user-account-btn" id="userAccountBtn" style="display:none;">
              <i class="fas fa-user"></i>
              <span class="user-name">Credi News</span>
              <i class="fas fa-chevron-down"></i>
              <div class="user-dropdown" id="userDropdown"></div>
            </div>
          </div>
      </nav>
    </div>

                <!-- Statistics Section -->
        <section class="statistics-section">
            <div class="container">
                <div class="stats-grid">
                    <div class="stat-box stat-card stat-card--credible">
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-content">
                             <div id="total-analyzed" class="stat-number">--</div>
                             <div class="stat-label">Facebook News Analyzed</div>
                         </div>
                     </div>
                     <div class="stat-box stat-card stat-card--credible">
                         <div class="stat-icon">
                             <i class="fas fa-check-circle"></i>
                         </div>
                         <div class="stat-content">
                             <div id="credible-count" class="stat-number">--</div>
                             <div class="stat-label">Credible (Verified)</div>
                        </div>
                    </div>
                    <div class="stat-box stat-card stat-card--low">
                        <div class="stat-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="stat-content">
                            <div id="low-count" class="stat-number">--</div>
                            <div class="stat-label">Low Credibility (Fake)</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="container">
                <div class="charts-grid">
                    <!-- Labels Breakdown Doughnut -->
                    <div class="chart-container">
                        <div class="chart-header">
                            <div>
                                <div class="chart-title">Credibility Labels Breakdown</div>
                                <div class="chart-subtitle">CREDIBLE, LOW, MIXED, UNVERIFIED</div>
                            </div>
                        </div>
                        <canvas id="breakdownChart"></canvas>
                    </div>

                    <!-- Volume Line Chart with Filters -->
                    <div class="chart-container">
                        <div class="chart-header">
                            <div>
                                <div class="chart-title">Volume of News Analyzed</div>
                                <div class="chart-subtitle">Switch between Day / Week / Month / Year</div>
                            </div>
                            <div class="filter-buttons" id="timeFilters">
                                <button id="filter-day" type="button">Day</button>
                                <button id="filter-week" type="button">Week</button>
                                <button id="filter-month" type="button" class="active">Month</button>
                                <button id="filter-year" type="button">Year</button>
                            </div>
                        </div>
                        <canvas id="volumeChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="reports.js"></script>
    
        
</body>
 </html>
